version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: fincan
      SESSION_SECRET: "someSuperSecretString"
      JWT_SECRET: "8D]gj<},-@YZT.dcHo1BQ{y_n2Nr0.At<Wemd._uwTla0WQcmig=slKTno35kkm"

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_customers.sql:/docker-entrypoint-initdb.d/02_data.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql
      - ./database/procedure.sql:/docker-entrypoint-initdb.d/04_procedure.sql
      
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=fincan
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=password"]
      interval: 5s
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: password
      PMA_PORT: 3306

volumes:
  mysql_data: